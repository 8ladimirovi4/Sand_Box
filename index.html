<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PushState and PopState Example</title>
</head>
<body>
  <button data-creature="dragon">Dragon</button>
  <button data-creature="phoenix">Phoenix</button>

  <div id="content"></div>

  <script>
    document.addEventListener("click", async (event) => {
      const creature = event.target.getAttribute("data-creature");
      if (creature) {
        event.preventDefault();
        try {
          const response = await fetch(`creatures/${creature}.json`);
          const json = await response.json();
    
     
        displayContent(json);
        // Add a new entry to the history.
        history.pushState(json, "", creature);
        } catch (err) {
          console.error(err);
        }
      }
    });

    function displayContent(data) {
      const contentDiv = document.getElementById("content");
      contentDiv.innerHTML = `<h1>${data.name}</h1><p>Power: ${data.power}</p>`;
    }

    function clearContent() {
      const contentDiv = document.getElementById("content");
      contentDiv.innerHTML = ""; // Clear the content
    }

    window.addEventListener("popstate", (event) => {
      if (!event.state) {
        // Очистить или скрыть контент при возвращении на старую страницу
        clearContent();
      } else {
        // Отобразить сохраненный контент
        displayContent(event.state);
      }
    });
  </script>
</body>
</html>
