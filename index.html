<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webix Example with Callback</title>
  <script src="https://cdn.webix.com/edge/webix.js"></script>
  <link rel="stylesheet" href="https://cdn.webix.com/edge/webix.css">
</head>
<body>

<script>
  // Определяем функцию buildPageLayout
  this.buildPageLayout = function (complete) {
    // Создаем компонент Webix — шаблон
    let content = webix.ui({
      view: 'template',   // Это компонент-шаблон
      id: 'mainTemplate', // Присваиваем id, чтобы легче было работать с элементом
      template: "<div>Это начальный контент</div>", // Изначальное содержимое шаблона
      autoheight: true,
      borderless: true
    });

    // Если передана функция complete, вызываем её и передаем объект content
    if (complete) complete(content);
  };

  // Вызовем функцию buildPageLayout и передадим в нее callback (функцию complete)
  this.buildPageLayout(function(content) {
    // Здесь мы в callback будем изменять содержимое шаблона

    // Меняем содержимое шаблона через метод setHTML
    content.setHTML("<div><b>Контент изменен!</b><br>Нажмите кнопку ниже:</div>");

    // Добавляем кнопку под шаблоном
    webix.ui({
      view: "button",
      value: "Нажми меня",
      width: 150,
      click: function() {
        // При клике на кнопку меняем контент снова
        content.setHTML("<div><b>Контент был снова изменен после клика!</b></div>");
      }
    }, $$('mainTemplate').$view.parentNode); // Добавляем кнопку под элементом шаблона
  });
</script>

</body>
</html>
