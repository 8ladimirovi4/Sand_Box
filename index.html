<!DOCTYPE html>
<html>
<head>
    <title>Пример диаграммы с mxGraph</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

    <link rel="stylesheet" type="text/css" href="css/style.css">
   
</head>
<body>
<input type="number" id="rightAxis" placeholder="значения справа" value="5"> <text>увеличить шкалу справа</text><br/>

<input type="number" id="dataInput" value="0"> <text>данные</text><br/>
<br>
<select name="time" id="time_range"> 
    <option value="">Временной диапазон</option>

    <option value="minute">minute</option>
    <option value="hour">hour</option>
    <option value="day">day</option>
    <option value="week">week</option>
    <option value="month">month</option>
    <option value="year">year</option>
  </select>
  <text>Значение по умолчанию days</text>
  <br>
  <br>
  <input type="number" value="1" id="step_input"> <text>Шаг сетки</text>
<canvas id="myChart"></canvas>
