<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контекстное меню</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        td {
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }

        /* Стили для контекстного меню */
        #contextMenu {
            display: none;
            position: absolute;
            z-index: 1000;
            background-color: #fff;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            width: 150px;
        }

        #contextMenu ul {
            list-style: none;
            padding: 10px 0;
            margin: 0;
        }

        #contextMenu li {
            padding: 8px 12px;
            cursor: pointer;
        }

        #contextMenu li:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

<h2>Таблица с контекстным меню</h2>
<table id="myTable">
    <tr>
        <td>Ячейка 1</td>
        <td>Ячейка 2</td>
        <td>Ячейка 3</td>
    </tr>
    <tr>
        <td>Ячейка 4</td>
        <td>Ячейка 5</td>
        <td>Ячейка 6</td>
    </tr>
</table>

<!-- Контекстное меню -->
<div id="contextMenu">
    <ul>
        <li id="paste">Вставить из буфера обмена</li>
    </ul>
</div>

<script>
    const table = document.getElementById('myTable');
    const contextMenu = document.getElementById('contextMenu');
    let selectedCell = null;

    // Показать контекстное меню
    table.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        
        // Получаем выбранную ячейку
        selectedCell = e.target;
        
        // Позиционирование контекстного меню
        contextMenu.style.display = 'block';
        contextMenu.style.left = `${e.pageX}px`;
        contextMenu.style.top = `${e.pageY}px`;
    });

    // Скрыть контекстное меню при клике вне его
    document.addEventListener('click', function() {
        contextMenu.style.display = 'none';
    });

    // Вставить данные из буфера обмена в выбранную ячейку
    document.getElementById('paste').addEventListener('click', async function() {
        try {
            // Получаем текст из буфера обмена
            const text = await navigator.clipboard.readText();
            
            // Вставляем текст в выбранную ячейку
            if (selectedCell) {
                selectedCell.textContent = text;
            }

            // Скрываем контекстное меню
            contextMenu.style.display = 'none';
        } catch (err) {
            console.error('Ошибка при вставке данных из буфера обмена: ', err);
        }
    });
</script>

</body>
</html>
